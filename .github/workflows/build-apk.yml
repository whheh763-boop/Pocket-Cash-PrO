name: Build Android APK

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch: 

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Create real google-services.json if missing
        run: |
          if [ ! -f "app/google-services.json" ]; then
            echo '{"project_info": {"project_number": "144641270230","firebase_url": "https://pocketcash-pro-default-rtdb.firebaseio.com","project_id": "pocketcash-pro","storage_bucket": "pocketcash-pro.firebasestorage.app"},"client": [{"client_info": {"mobilesdk_app_id": "1:144641270230:android:310950f3b7dba463fd0477","android_client_info": {"package_name": "com.aistudio.pocketcash.pcp"}},"oauth_client": [{"client_id": "144641270230-2n2vpu2nps9e8pb69erfocrqj9c0f7pl.apps.googleusercontent.com","client_type": 3}],"api_key": [{"current_key": "AIzaSyDDOY9bsY3hiYjHcc3kiOYWwTJ13WLsnpI"}],"services": {"appinvite_service": {"other_platform_oauth_client": [{"client_id": "144641270230-2n2vpu2nps9e8pb69erfocrqj9c0f7pl.apps.googleusercontent.com","client_type": 3}]}}}]} ' > app/google-services.json
          fi

      - name: Generate Debug Keystore if missing
        run: |
          if [ ! -f "debug.keystore" ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "C=US, O=Android, CN=Android Debug"
          fi

      - name: Fix KSP and Memory constraints
        run: |
          # Remove in-process strategy which causes KSP NullPointerException
          sed -i '/kotlin.compiler.execution.strategy=in-process/d' gradle.properties || true
          echo "org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8" >> gradle.properties

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PocketCash-Pro-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
